<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | AI Career Guidance</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='reset_password.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- =========================
         BACKGROUND CIRCLES
    ========================== -->
    <div class="background">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>


    <!-- =========================
         TOP NAVBAR
    ========================== -->
    <nav class="top-navbar">

        <div class="nav-logo">
            <i class="fas fa-brain"></i>
            <span>AI Career Guidance</span>
        </div>

        <div class="nav-links">

            <a href="/">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>

            <a href="/login">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>Login</span>
            </a>

        </div>

    </nav>


    <!-- =========================
         MAIN CONTENT
    ========================== -->
    <main class="container">

        <!-- LEFT PANEL -->
        <section class="left-panel">

            <h1>
                Create New<br>
                Password
            </h1>

            <p>
                Your account security is our priority.
                Create a strong password to keep your
                account safe.
            </p>

            <img
                src="{{ url_for('static', filename='images/images(5).png') }}"
                alt="Reset Password"
                class="illustration">

        </section>


        <!-- RIGHT PANEL -->
        <section class="right-panel">

            <div class="glass-card">

                <h2>Reset Password</h2>

                <p class="sub">
                    Enter your new password below.
                </p>


                <!-- RESET FORM -->
                <form method="POST" id="resetForm">

                    <!-- NEW PASSWORD -->
                    <div class="input-box">

                        <i class="fa-solid fa-lock input-icon"></i>

                        <input
                            type="password"
                            name="password"
                            id="password"
                            placeholder="New Password"
                            required>

                        <span class="eye" id="passwordEye">

                            <i
                                class="fa-solid fa-eye-slash"
                                id="togglePassword">
                            </i>

                        </span>

                    </div>


                    <!-- PASSWORD STRENGTH -->
                    <div class="strength">

                        <div id="strength-bar"></div>

                    </div>

                    <small id="strength-text">
                        Password Strength
                    </small>


                    <!-- CONFIRM PASSWORD -->
                    <div class="input-box">

                        <i class="fa-solid fa-lock input-icon"></i>

                        <input
                            type="password"
                            name="confirm_password"
                            id="confirm_password"
                            placeholder="Confirm Password"
                            required>

                        <span class="eye" id="confirmEye">

                            <i
                                class="fa-solid fa-eye-slash"
                                id="toggleConfirm">
                            </i>

                        </span>

                    </div>


                    <!-- UPDATE BUTTON -->
                    <button
                        type="submit"
                        class="reset-btn">

                        <i class="fa-solid fa-key"></i>

                        <span>Update Password</span>

                    </button>

                </form>


                <!-- BACK TO LOGIN -->
                <a
                    href="/login"
                    class="back">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back to Login

                </a>

            </div>

        </section>

    </main>


    <script src="{{ url_for('static', filename='reset_password.js') }}"></script>

</body>
</html>
