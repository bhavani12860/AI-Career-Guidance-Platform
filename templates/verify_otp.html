<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Verify OTP | AI Career Guidance</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='verify_otp.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- Animated Background -->

    <div class="background">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>

    <div class="container">

        <!-- Left Section -->

        <div class="left-section">

            <div class="logo">

                <i class="fa-solid fa-shield-halved"></i>

                <h2>AI Career Guidance</h2>

            </div>

            <h1>Verify OTP</h1>

            <p>

                We have sent a secure 6-digit OTP to your
                registered email address.

                Enter the OTP below to continue resetting
                your password.

            </p>

            <img
                src="{{ url_for('static', filename='images/images(6).png') }}"
                class="illustration"
                alt="OTP">

        </div>

        <!-- Right Section -->

        <div class="right-section">

            <div class="otp-card">

                <h2>OTP Verification</h2>

                <p>

                    Enter the 6-digit verification code

                </p>

                <form action="/verify-otp" method="POST">

                    <div class="otp-box">

                        <input type="text"
                               maxlength="1"
                               class="otp-input"
                               aria-label="OTP Digit 1"
                               required>

                        <input type="text"
                               maxlength="1"
                               class="otp-input"
                               aria-label="OTP Digit 1"
                               required>

                        <input type="text"
                               maxlength="1"
                               class="otp-input"
                               aria-label="OTP Digit 1"
                               required>

                        <input type="text"
                               maxlength="1"
                               class="otp-input"
                               aria-label="OTP Digit 1"
                               required>

                        <input type="text"
                               maxlength="1"
                               class="otp-input"
                               aria-label="OTP Digit 1"
                               required>

                        <input type="text"
                               maxlength="1"
                               class="otp-input"
                               aria-label="OTP Digit 1"
                               required>

                    </div>

                    <!-- Hidden OTP -->

                    <input
                        type="hidden"
                        name="otp"
                        id="otp">

                    <div class="timer">

                        <i class="fa-regular fa-clock"></i>

                        <span id="countdown">

                            02:00

                        </span>

                    </div>

                    <button
                        type="submit"
                        class="verify-btn">

                        <i class="fa-solid fa-circle-check"></i>

                        Verify OTP

                    </button>

                </form>

                <div class="resend">

                    Didn't receive OTP?

                    <a href="/forgot-password">

                        Resend OTP

                    </a>

                </div>

                <div class="back">

                    <a href="/login">

                        <i class="fa-solid fa-arrow-left"></i>

                        Back to Login

                    </a>

                </div>

            </div>

        </div>

    </div>

    <script src="{{ url_for('static', filename='verify_otp.js') }}"></script>

</body>

</html>
